{% comment %}
    Notificaciones flotantes generadas en las vistas con
    django.contrib.messages (messages.success, messages.error, ...).
{% endcomment %}
{% if messages %}
    <div class="toast-stack" role="status" aria-live="polite">
        {% for mensaje in messages %}
            <p class="toast toast--{{ mensaje.tags }}">{{ mensaje }}</p>
        {% endfor %}
    </div>
{% endif %}
