{% comment %}
    Campo de formulario reutilizable (BEM: form-field).
    Uso: {% include "partials/_campo.html" with campo=form.email %}
{% endcomment %}
<div class="form-field{% if campo.errors %} form-field--invalid{% endif %}">
    <label class="form-field__label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}
        <small class="form-field__help">{{ campo.help_text }}</small>
    {% endif %}
    {% for error in campo.errors %}
        <p class="form-field__error">{{ error }}</p>
    {% endfor %}
</div>
